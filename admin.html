<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <title>Panel Organizador</title>

    <style>

        body{
            font-family:Arial;
            background:#1b1b1b;
            color:white;
            padding:20px;
        }

        table{

            width:100%;
            border-collapse:collapse;

        }

        th,td{

            border:1px solid #555;
            padding:12px;
            text-align:center;

        }

        th{

            background:#333;

        }

        tr:nth-child(even){

            background:#2a2a2a;

        }

        .verde{

            color:#5cff5c;

        }

        .amarillo{

            color:#ffd54f;

        }

        .rojo{

            color:#ff6b6b;

        }

        button{

            padding:10px 20px;
            font-size:18px;
            margin-bottom:20px;
            cursor:pointer;

        }

    </style>

</head>

<body>

<h1>Panel Organizador</h1>

<button onclick="reiniciarGymkana()">
🔄 Reiniciar Gymkana
</button>

<table>

<thead>

<tr>

<th>Equipo</th>
<th>Última prueba</th>
<th>Se dirige a</th>
<th>Tiempo</th>

</tr>

</thead>

<tbody id="tablaEquipos">

</tbody>

</table>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore-compat.js"></script>

<script src="firebase.js"></script>
<script src="admin.js"></script>

</body>

</html>
