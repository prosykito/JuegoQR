<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comprobación de acceso</title>

<style>

body{

    font-family:Arial;
    background:white;
    color:black;
    max-width:700px;
    margin:auto;
    padding:20px;

}

label{

    display:block;
    margin-top:20px;
    margin-bottom:5px;
    font-weight:bold;

}

input{

    width:100%;
    padding:10px;
    font-size:18px;
    box-sizing:border-box;

}

button{

    margin-top:25px;
    padding:12px 25px;
    font-size:18px;
    cursor:pointer;

}

#resultado{

    margin-top:25px;
    font-size:22px;
    font-weight:bold;

}

</style>

</head>

<body>

<h2>Comprobación de acceso y funcionamiento</h2>

<p>

Si puedes leer este mensaje, la página ha cargado correctamente.

</p>

<p>

Introduce:

<br><br>

<b>Código:</b> 1234

<br>

<b>Respuesta:</b> prueba

</p>

<label>Código</label>

<input id="codigo">

<label>Respuesta</label>

<input id="respuesta">

<button onclick="comprobar()">

Comprobar

</button>

<p id="resultado"></p>

<script>

function normalizar(texto){

    return texto
        .trim()
        .toLowerCase();

}

function comprobar(){

    let codigoCorrecto =
        normalizar(document.getElementById("codigo").value)=="1234";

    let respuestaCorrecta =
        normalizar(document.getElementById("respuesta").value)=="prueba";

    let resultado=document.getElementById("resultado");



    if(codigoCorrecto && respuestaCorrecta){

        resultado.style.color="green";

        resultado.innerHTML="✅ CORRECTO";

    }

    else if(!codigoCorrecto && !respuestaCorrecta){

        resultado.style.color="red";

        resultado.innerHTML="❌ Código incorrecto<br><br>❌ Respuesta incorrecta";

    }

    else if(!codigoCorrecto){

        resultado.style.color="red";

        resultado.innerHTML="❌ Código incorrecto";

    }

    else{

        resultado.style.color="red";

        resultado.innerHTML="❌ Respuesta incorrecta";

    }

}

</script>

</body>

</html>
