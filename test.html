<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comprobación de acceso</title>

<style>

body{

    font-family:Arial;
    background:white;
    color:black;
    max-width:700px;
    margin:auto;
    padding:20px;

}

label{

    display:block;
    margin-top:20px;
    margin-bottom:5px;
    font-weight:bold;

}

input{

    width:100%;
    padding:10px;
    font-size:18px;
    box-sizing:border-box;

}

button{

    margin-top:25px;
    padding:12px 25px;
    font-size:18px;
    cursor:pointer;

}

#resultado{

    margin-top:25px;
    font-size:22px;
    font-weight:bold;

}

</style>

</head>

<body>

<h2>Comprobación de acceso y funcionamiento</h2>

<p>

Si puedes leer este mensaje, la página ha cargado correctamente. Aquí tendrás la pregunta.

</p>

<label>Código</label>

<input id="codigo">

<label>Respuesta</label>

<input id="respuesta">

<button onclick="comprobar()">

Comprobar

</button>

<p id="resultado"></p>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore-compat.js"></script>
    
<script>
    
console.log("TEST VERSION 1.5");
    
    const firebaseConfig = {

    apiKey: "AIzaSyDt4Y6mGL2nbUFNUTMpOP6cxyRnr3s2M2o",
    authDomain: "gymkana-5b9f5.firebaseapp.com",
    projectId: "gymkana-5b9f5",
    storageBucket: "gymkana-5b9f5.firebasestorage.app",
    messagingSenderId: "131301441295",
    appId: "1:131301441295:web:1be4f934c78cfc3c29087a"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
    
function normalizar(texto){

    return texto
        .trim()
        .toLowerCase();

}

function comprobar(){

    let codigoCorrecto =
        normalizar(document.getElementById("codigo").value)=="1234";

    let respuestaCorrecta =
        normalizar(document.getElementById("respuesta").value)=="prueba";

    let resultado=document.getElementById("resultado");



    if(codigoCorrecto && respuestaCorrecta){

            let equipo = "";

            while (true) {
            
                const respuesta = prompt(
                    "✅ Prueba superada.\n\nEscribe el nombre de tu equipo (Cancelar para omitir):"
                );
            
                if (respuesta === null)
                    break;
            
                if (respuesta.trim() !== "") {
            
                    equipo = respuesta.trim();
                    break;
            
                }
            
            }
            
            if (equipo !== "") {
            
                db.collection("testConexion").add({
            
                    equipo: equipo,
            
                    fecha: Date.now()
            
                });
            
            }
                
            resultado.style.color="green";
        
            resultado.innerHTML=`
        
        ✅ <b>CORRECTO</b>
        
        <br><br>
        
        <b>Siguiente ubicación</b>
        
        <br>
        
        Aquí aparecerá la coordenada de la siguiente prueba.
        
        <br><br>
        
        <b>Código de acceso</b>
        
        <br>
        
        Aquí aparecerá el código que deberás introducir en la siguiente prueba.
        
        `;
        
        }
        
        else if(!codigoCorrecto && !respuestaCorrecta){
        
            resultado.style.color="red";
        
            resultado.innerHTML="❌ Código incorrecto<br><br>❌ Respuesta incorrecta";
        
        }
        
        else if(!codigoCorrecto){
        
            resultado.style.color="red";
        
            resultado.innerHTML="❌ Código incorrecto";
        
        }
        
        else{
        
            resultado.style.color="red";
        
            resultado.innerHTML="❌ Respuesta incorrecta";
        
        }

}

</script>

</body>

</html>
