<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego QR</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="contenedor">

        <h1 id="titulo">HOSPITAL PSIQUIÁTRICO</h1>

        <p id="pregunta">
            Cargando...
        </p>

        <div id="multimedia"></div>
        
        <label><b>Código</b></label>

        <input
        type="text"
        id="codigo"
        placeholder="Código recibido">
        
        <br><br>
        
        <label><b>Respuesta</b></label>
        
        <input
        type="text"
        id="respuesta"
        placeholder="Escribe la respuesta">

        <br><br>

        <button onclick="comprobar()">
            Comprobar
        </button>

        <p id="resultado"></p>

    </div>

    <script src="preguntas.js"></script>
    <script src="equipos.js"></script>
    <script src="script.js"></script>

</body>
</html>
