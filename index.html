<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Hospital Psiquiátrico San Martín de Valvení
    </title>

    <link rel="stylesheet" href="estilo.css">

</head>

<body>

<div class="contenedor">

    <!-- ========================= -->
    <!-- CABECERA                  -->
    <!-- ========================= -->

    <div class="cabecera">

        <img src="hospitalpsi.jpg" alt="Hospital">

    </div>


    <!-- ========================= -->
    <!-- CONTENIDO                 -->
    <!-- ========================= -->

    <div class="contenido">

        <h1>

            HOSPITAL PSIQUIÁTRICO<br>

            SAN MARTÍN DE VALVENÍ

        </h1>


        <div class="subtitulo">

            Test de evaluación psiquiátrica

        </div>


        <p id="pregunta">

            Cargando...

        </p>


        <div id="multimedia"></div>


        <label>

            <b>Código de acceso</b>

        </label>


        <input

            type="text"

            id="codigo"

            placeholder="Introduce el código"

        >


        <br><br>


        <label>

            <b>Diagnóstico</b>

        </label>


        <input

            type="text"

            id="respuesta"

            placeholder="Escribe la respuesta"

        >


        <br><br>


        <button onclick="comprobar()">

            REALIZAR DIAGNÓSTICO

        </button>

        <div id="credencial"></div>
        <p id="resultado"></p>

    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore-compat.js"></script>

<!-- Cambia aquí si quieres usar las preguntas finales -->
<script src="preguntas.js"></script>
<!-- <script src="preguntasbuenas.js"></script> -->

<script src="equipos.js"></script>
<script src="firebase.js"></script>
<script src="script.js"></script>

</body>

</html>
